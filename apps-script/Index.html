<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Incidencias">
<title>Incidencias Escuela 26-27</title>
<script src="config.js?v=6"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --rojo:#b3121f; --rojo-2:#d4202f; --rojo-suave:#fdecee;
  --azul:#16213a; --tinta:#1b1f29; --gris:#6b7280; --linea:#e6e8ee; --fondo:#f4f5f8; --blanco:#fff;
  --verde:#15803d; --verde-suave:#e7f6ec; --ambar:#b45309; --ambar-suave:#fff4e0;
  --radio:16px; --sombra:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.oculto{display:none!important}

/* ---------- login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  background:linear-gradient(160deg,var(--rojo) 0%,#7d0b15 100%);color:#fff}
#login{background:linear-gradient(180deg,var(--rojo) 0%,var(--rojo) 45%,#7d0b15 100%);justify-content:flex-start;padding-top:0}
.portada{position:relative;margin:0 -24px 26px;padding-top:env(safe-area-inset-top);background:#7d0b15}
.portada img{display:block;width:100%;height:auto}
.portada::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:45%;background:linear-gradient(180deg,rgba(179,18,31,0),var(--rojo))}
#login .relleno{flex:1}
#login .marca{font-weight:800;letter-spacing:.08em;font-size:13px;opacity:.85;text-transform:uppercase}
#login h1{font-size:34px;line-height:1.1;margin:8px 0 6px}
#login p{opacity:.85;margin:0 0 28px}
#login .caja{background:#fff;color:var(--tinta);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#login label{font-size:13px;font-weight:600;color:var(--gris)}
#codigo{width:100%;margin:8px 0 14px;padding:14px 16px;border:2px solid var(--linea);border-radius:12px;font-size:24px;letter-spacing:.3em;text-transform:uppercase;text-align:center;outline:none}
#codigo:focus{border-color:var(--rojo)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--rojo);color:#fff;font-weight:700;font-size:17px}
.btn:active{transform:scale(.99);background:#9a0f1a}
.btn[disabled]{opacity:.5}
.btn.sec{background:var(--blanco);color:var(--tinta);border:1.5px solid var(--linea)}
.err{color:var(--rojo);font-size:14px;min-height:20px;margin-top:10px;text-align:center}

/* ---------- cabecera */
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.yo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);flex:none;background:#2a3655}
.quienwrap{display:flex;align-items:center;gap:12px}
.mini{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:-4px 6px -4px -4px}
.top .hola{font-size:13px;opacity:.7}
.top .quien{font-weight:700;font-size:18px}
.icono{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.meses{display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.mes{flex:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:14px;scroll-snap-align:center}
.mes.on{background:#fff;color:var(--azul)}
.mes .cand{font-size:11px;margin-left:4px;opacity:.7}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:12px 0 13px;color:rgba(255,255,255,.65);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--rojo-2)}

main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.grupos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grupo{padding:8px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--linea);font-size:13px;font-weight:600}
.grupo.on{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-suave)}
.resumen{background:#fff;border-radius:var(--radio);padding:14px 16px;box-shadow:var(--sombra);margin-bottom:12px}
.resumen .fila{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--gris)}
.resumen b{color:var(--tinta);font-size:20px}
.barra{height:8px;border-radius:99px;background:var(--linea);margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.aviso{background:var(--ambar-suave);color:var(--ambar);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.buscar{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;margin-bottom:10px;outline:none}
.buscar:focus{border-color:var(--azul)}

.lista{display:flex;flex-direction:column;gap:8px}
.mon{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sombra)}
.mon:active{background:#fafafa}
.av{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--fondo);color:var(--azul);font-size:15px}
.mon .info{flex:1;min-width:0}
.mon .nom{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .sub{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.d{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--fondo);color:#9aa0ab}
.d.fijo{background:var(--azul);color:#fff}
.estado{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.estado.guardado{background:var(--verde-suave);color:var(--verde)}
.estado.pendiente{background:var(--fondo);color:var(--gris)}
.estado.enhoja{background:var(--ambar-suave);color:var(--ambar)}
.estado.enviando{background:#e8eefc;color:#1d4ed8}
.estado.error{background:var(--rojo-suave);color:var(--rojo)}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}

/* ---------- ficha */
#ficha{position:fixed;inset:0;z-index:20;background:var(--fondo);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;}
#ficha.abierta{transform:none}
.fcab{position:sticky;top:0;z-index:2;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea)}
.fcab .icono{background:var(--fondo);color:var(--tinta)}
.fcab .t{flex:1;min-width:0}
.fcab .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcab .t span{font-size:13px;color:var(--gris)}
.fcuerpo{padding:14px 14px 10px;max-width:680px;margin:0 auto}
.tarjeta{background:#fff;border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
.tarjeta h3{margin:0 0 4px;font-size:15px}
.tarjeta .ayuda{font-size:13px;color:var(--gris);margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--gris);padding:2px 0 4px}
.cal .h.fijo{color:var(--azul)}
.dia{aspect-ratio:1/0.9;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--fondo);color:#8a909c;border:2px solid transparent;position:relative}
.dia.fijo{border-color:#c9cfdd;color:var(--azul)}
.dia.on{background:var(--azul);border-color:var(--azul);color:#fff}
.dia.fest{background:repeating-linear-gradient(135deg,#f4f5f8 0 6px,#eceef3 6px 12px);color:#b3b8c2}
.dia.fest.on{background:var(--azul);color:#fff}
.dia small{font-size:9px;font-weight:600;line-height:1;margin-top:2px;opacity:.8}
.dia.hoy::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--rojo-2)}
.vacio-dia{visibility:hidden}
.conteo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;text-align:center}
.conteo div{font-size:12px;color:var(--gris)}
.conteo b{display:block;font-size:20px;color:var(--tinta)}
.pista{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--ambar-suave);color:var(--ambar);padding:10px 12px;border-radius:12px;font-size:14px}
.pista button{margin-left:auto;font-weight:700;color:var(--ambar);text-decoration:underline;font-size:14px;flex:none}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--gris);margin-top:10px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

.campo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.campo:first-of-type{border-top:0}
.campo .et{font-weight:600;font-size:15px}
.campo .et small{display:block;font-weight:400;color:var(--gris);font-size:12px}
.paso{display:flex;align-items:center;gap:4px;flex:none}
.paso button{width:40px;height:40px;border-radius:12px;background:var(--fondo);font-size:22px;font-weight:700;color:var(--azul)}
.paso button:active{background:#e3e6ee}
.paso output{min-width:36px;text-align:center;font-size:20px;font-weight:700}
.num{width:110px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:12px;text-align:right;font-size:17px;font-weight:600;outline:none}
.num:focus,textarea:focus{border-color:var(--azul)}
.sufijo{display:flex;align-items:center;gap:6px;color:var(--gris);font-weight:600}
textarea{width:100%;min-height:96px;padding:12px;border:1.5px solid var(--linea);border-radius:12px;resize:vertical;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 10px;border-radius:999px;background:var(--fondo);font-size:13px;font-weight:600;color:var(--azul)}
.meta{font-size:12px;color:var(--gris);text-align:center;margin-top:6px}

.pie{position:sticky;bottom:0;z-index:3;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--fondo) 70%,rgba(244,245,248,0))}
.pie .btn{max-width:652px;margin:0 auto;box-shadow:0 6px 18px rgba(179,18,31,.3)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
body.conBanner #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
#toast.si{opacity:1;transform:translateX(-50%)}
#toast.mal{background:var(--rojo)}
.cargando{display:flex;justify-content:center;padding:40px}
.spin{width:28px;height:28px;border:3px solid var(--linea);border-top-color:var(--rojo);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

.conex{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);color:#fff}
.conex i{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:none}
.conex.ok i{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.conex.envia i{background:#60a5fa;animation:lat 1s infinite}
.conex.mal i{background:#f87171}
@keyframes lat{50%{opacity:.3}}
#instalarBanner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;background:#fff;color:var(--tinta);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px;display:flex;gap:12px;align-items:center;max-width:520px;margin:0 auto}
#instalarBanner img{width:44px;height:44px;border-radius:10px;flex:none}
#instalarBanner .tx{flex:1;font-size:14px;line-height:1.35}
#instalarBanner .tx b{display:block;font-size:15px}
#instalarBanner .acc{display:flex;flex-direction:column;gap:6px;flex:none}
#instalarBanner .acc button{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px}
#instalarBanner .si{background:var(--rojo);color:#fff}
#instalarBanner .no{color:var(--gris);font-size:13px!important;padding:4px!important}
#menu{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#menu .hoja{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#menu .hoja p{margin:0 0 14px;color:var(--gris);font-size:14px}
#menu .hoja .btn{margin-top:8px}

#fondoFicha{position:fixed;inset:0;z-index:19;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .25s}
/* ---------- ordenador / tablet */
@media (min-width:900px){
  .portada,#login .relleno{display:none}
  #login{align-items:flex-end;justify-content:center;padding-right:7vw;background:linear-gradient(90deg,rgba(179,18,31,0) 0,rgba(179,18,31,0) 48%,var(--rojo) 56%),url(fotos/equipo.jpg) left center/56% auto no-repeat,linear-gradient(160deg,var(--rojo),#7d0b15)}
  #login>*{width:100%;max-width:440px}
  header{padding-left:32px;padding-right:32px}
  header>*{max-width:1240px;margin-left:auto;margin-right:auto}
  .tabs{justify-content:flex-start;gap:24px}
  .tab{flex:none;padding:12px 6px 13px}
  main{max-width:1240px;padding:22px 32px 40px}
  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .resumen-fila{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
  .resumen-fila .buscar{margin:0;height:100%}
  .mon:hover{box-shadow:0 0 0 2px var(--azul) inset,var(--sombra)}
  #ficha{left:auto;width:min(900px,70vw);transform:translateX(100%);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  #ficha.abierta{transform:none}
  #ficha.abierta+#fondoFicha{opacity:1;pointer-events:auto}
  .fcuerpo{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;padding:18px}
  .fcuerpo .tarjeta{margin:0}
  .fcuerpo .tarjeta:first-child{grid-row:span 2}
  .pie .btn{max-width:340px;margin:0 0 0 auto}
  .dia{aspect-ratio:auto;height:54px}
  .dia:hover{filter:brightness(.96)}
  .mis{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .mis .tarjeta{margin:0}
  #mGuardar{max-width:340px;margin:14px 0 0 auto}
  #toast{bottom:28px}
}
@media (min-width:900px) and (max-width:1150px){ .fcuerpo{grid-template-columns:1fr} .fcuerpo .tarjeta:first-child{grid-row:auto} }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="login">
  <div class="portada"><picture><source media="(min-width:900px)" srcset="fotos/equipo.jpg"><img src="fotos/equipo-movil.jpg" alt="Responsables de la Escuela"></picture></div>
  <div class="relleno"></div>
  <div class="marca">Fundación · Escuela 26-27</div>
  <h1>Registro de incidencias</h1>
  <p>Apunta los viajes, ausencias y sustituciones de tus monitores desde el móvil.</p>
  <div class="caja">
    <label for="codigo">Tu código de acceso</label>
    <input id="codigo" maxlength="12" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="······">
    <button class="btn" id="entrar">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- ======================= APP ======================= -->
<section id="app" class="oculto">
  <header>
    <div class="top">
      <div class="quienwrap"><img class="yo oculto" id="yo" alt="">
        <div><div class="hola">Hola,</div><div class="quien" id="quien"></div>
        <button class="conex" id="conexion" aria-live="polite"><i></i><span>Conectando…</span></button></div></div>
      <button class="icono" id="btnMenu" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="meses" id="meses"></div>
    <div class="tabs">
      <button class="tab on" data-tab="monitores">Monitores</button>
      <button class="tab" data-tab="mis" id="tabMis">Mis datos</button>
    </div>
  </header>
  <main id="main"></main>
</section>

<!-- ======================= FICHA MONITOR ======================= -->
<section id="ficha" aria-hidden="true">
  <div class="fcab">
    <button class="icono" id="cerrarFicha" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="t"><b id="fNombre"></b><span id="fSub"></span></div>
  </div>
  <div class="fcuerpo" id="fCuerpo"></div>
  <div class="pie"><button class="btn" id="guardar">Guardar</button></div>
</section>
<div id="fondoFicha"></div>

<div id="menu" class="oculto"><div class="hoja">
  <p id="menuInfo"></p>
  <button class="btn sec" id="recargar">Actualizar datos</button>
  <button class="btn sec oculto" id="instalar">Instalar en el móvil</button>
  <button class="btn" id="salir">Cerrar sesión</button>
</div></div>

<div id="toast"></div>
<div id="instalarBanner" class="oculto">
  <img src="icon-192.png" alt="">
  <div class="tx" id="instTx"></div>
  <div class="acc"><button class="si oculto" id="instSi">Instalar</button><button class="no" id="instNo">Ahora no</button></div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — pega aquí la URL de la implementación web
   de Apps Script (termina en /exec). Solo hace falta si la app
   se aloja fuera de Google (GitHub Pages, Netlify...).
   ============================================================ */
const API_URL = window.API_URL || '';

const DIAS_CORTOS = ['L','M','X','J','V'];
const DIAS_LARGOS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const MESES_NUM = {Octubre:10,Noviembre:11,Diciembre:12,Enero:1,Febrero:2,Marzo:3,Abril:4,Mayo:5,Junio:6};

const S = { codigo:null, user:null, mes:null, grupo:null, tab:'monitores', datos:{}, mis:{}, filtro:'', ficha:null, misResp:null, cola:[] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- almacenamiento (puede fallar en algunos navegadores) */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} },
  getJ(k){ try{ return JSON.parse(this.get(k)) }catch(e){ return null } },
  setJ(k,v){ this.set(k, JSON.stringify(v)); }
};
function guardarCache(){ if (S.codigo) store.setJ('inc_cache_'+S.codigo, { user:S.user, datos:S.datos, mis:S.mis }); }
function guardarCola(){ if (S.codigo) store.setJ('inc_cola_'+S.codigo, S.cola); if (typeof estadoConexion === 'function') estadoConexion(); }

/* ---------- llamada a la API: google.script.run si estamos dentro de Apps Script, fetch si no */
function api(action, params = {}) {
  const body = Object.assign({ action, codigo: S.codigo }, params);
  const fallo = (m, red) => { const e = new Error(m); e.red = !!red; return e; };
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ko) => google.script.run
      .withSuccessHandler(r => { const j = JSON.parse(r); j.ok ? ok(j.data) : ko(fallo(j.error)); })
      .withFailureHandler(e => ko(fallo(e && e.message || 'Error de conexión', true)))
      .apiRun(action, JSON.stringify(body)));
  }
  if (window.API_MOCK) return window.API_MOCK(body);
  if (!API_URL) return Promise.reject(fallo('La app aún no está conectada a la hoja (falta la URL en config.js).'));
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(r => r.json(), () => { throw fallo('Sin conexión. Se enviará cuando vuelva la cobertura.', true); })
    .then(j => { if (!j.ok) throw fallo(j.error); return j.data; });
}

function mostrarApp() {

async function entrar(codigo, silencioso) {
  const btn = $('#entrar');
  btn.disabled = true; $('#loginErr').textContent = '';
  S.codigo = codigo.trim().toUpperCase();
  S.mes = store.get('inc_mes'); S.grupo = store.get('inc_grupo');
  S.cola = store.getJ('inc_cola_'+S.codigo) || [];
  // 1) si hay datos guardados en el móvil, se ve todo al instante
  const c = store.getJ('inc_cache_'+S.codigo);
  if (c && c.user) { S.user = c.user; S.datos = c.datos || {}; S.mis = c.mis || {}; mostrarApp(); pintar(); }
  // 2) en una sola llamada: comprobar código + datos del mes
  try {
    let u, datos;
    try { u = await api('inicio', { mes: S.mes }); datos = u.datos; delete u.datos; }
    catch (e) {
      if (!/Acci[oó]n desconocida/.test(e.message)) throw e;
      S.antiguo = true; u = await api('login');                  // servidor de la versión anterior
      datos = await pedirMes(S.mes && u.meses.includes(S.mes) ? S.mes : u.mesActual, u);
    }
    S.user = u; S.datos[datos.mes] = fusionar(datos);
    if (!S.mes || !u.meses.includes(S.mes)) S.mes = datos.mes;
    store.set('inc_codigo', S.codigo); guardarCache();
    mostrarApp(); pintar(); marcarSinRed(false);
    enviarCola();
    precargar();
  } catch (e) {
    if (e.red && S.user) { marcarSinRed(true); return; }
    S.user = null; $('#app').classList.add('oculto'); $('#login').classList.remove('oculto');
    if (!silencioso || !e.red) $('#loginErr').textContent = e.message;
    if (!e.red) { store.del('inc_codigo'); store.del('inc_cache_'+S.codigo); }
  } finally { btn.disabled = false; }
}
$('#entrar').onclick = () => entrar($('#codigo').value);
$('#codigo').addEventListener('keydown', e => { if (e.key === 'Enter') entrar($('#codigo').value); });

/** Pide los datos de un mes (todos los grupos). Con el servidor antiguo, grupo a grupo. */
async function pedirMes(mes, u) {
  if (!S.antiguo) return api('mes', { mes });
  u = u || S.user;
  const partes = await Promise.all(u.grupos.map(g => api('mes', { mes, grupo:g })));
  const d = Object.assign({}, partes[0], { grupos:{} }); partes.forEach((p, i) => d.grupos[u.grupos[i]] = p.monitores);
  return d;
}

/** Descarga en segundo plano el resto de meses para que cambiar de mes sea instantáneo. */
async function precargar() {
  for (const m of S.user.meses.slice().reverse()) {
    if (S.datos[m] && S.datos[m]._fresco) continue;
    try { const d = await pedirMes(m); S.datos[m] = fusionar(d); guardarCache(); } catch (e) { return; }
  }
}

/** Mantiene los cambios locales que aún no se han enviado. */
function fusionar(d) {
  d._fresco = Date.now();
  S.cola.filter(x => x.action === 'guardarMonitor' && x.params.mes === d.mes).forEach(x => {
    const lista = d.grupos[x.params.grupo] || [];
    const i = lista.findIndex(m => m.key === x.params.key);
    if (i >= 0 && x.local) lista[i] = Object.assign({}, x.local, { estado:'enviando' });
  });
  return d;
}

/** Pinta lo que haya en el móvil y, si hace falta, lo refresca por detrás. */
function pintar() {
  if (S.tab === 'mis') return pintarMisDatosDesdeCache();
  const d = S.datos[S.mes];
  if (d) { S.datosMes = vista(d); pintarLista(); }
  else $('#main').innerHTML = '<div class="cargando"><div class="spin"></div></div>';
}
function vista(d) { return Object.assign({}, d, { grupo:S.grupo, monitores:(d.grupos[S.grupo] || []) }); }

async function cargar(forzar) {
  pintar();
  const mes = S.mes, tab = S.tab, d = S.datos[mes];
  if (tab === 'mis') return refrescarMisDatos(forzar);
  if (d && !forzar && Date.now() - d._fresco < 60000) return;     // reciente: no hace falta volver a pedir
  try {
    const nuevo = fusionar(await pedirMes(mes));
    S.datos[mes] = nuevo; guardarCache(); marcarSinRed(false);
    if (S.mes === mes && S.tab === 'monitores' && !S.ficha) pintar();
  } catch (e) {
    if (e.red) marcarSinRed(true);
    if (!S.datos[mes]) $('#main').innerHTML = `<div class="vacio">${esc(e.message)}<br><br><button class="btn sec" onclick="cargar(true)">Reintentar</button></div>`;
    else if (!e.red) toast(e.message, true);
  }
}

function titulo(s){ return String(s).toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()); }

/* ======================= CALENDARIO ======================= */
function diasHabiles(anio, mes) {           // [{d, wd(0=L..4=V)}]
  const n = new Date(anio, mes, 0).getDate(), out = [];
  for (let d = 1; d <= n; d++) { const w = new Date(anio, mes-1, d).getDay(); if (w>=1 && w<=5) out.push({d, wd:w-1}); }
  return out;
}

/** Días que aparecen marcados al abrir la ficha. */
function seleccionInicial(m, dm) {
  if (Array.isArray(m.dias)) return new Set(m.dias);
  const hab = diasHabiles(dm.anio, dm.mesNum), fest = dm.festivos, sel = new Set();
  const legacy = m.datos.conteo.some(v => typeof v === 'number');
  if (legacy) {                                  // reconstruir desde los números que ya hay en la hoja
    m.datos.conteo.forEach((v, i) => {
      if (v === 'x' || v === 'X') { hab.filter(h => h.wd===i && !fest[h.d]).forEach(h => sel.add(h.d)); return; }
      if (typeof v !== 'number' || v <= 0) return;
      const cand = hab.filter(h => h.wd===i && !fest[h.d]).concat(hab.filter(h => h.wd===i && fest[h.d]));
      cand.slice(0, v).forEach(h => sel.add(h.d));
    });
  } else {
    hab.forEach(h => { if ((m.fijos.includes(h.wd) || m.datos.conteo[h.wd]) && !fest[h.d]) sel.add(h.d); });
  }
  return sel;
}

/* ======================= FICHA ======================= */
function abrirFicha(m) {
  const dm = S.datosMes;
  S.ficha = {
    m, sel: seleccionInicial(m, dm), sucio: false,
    v: { partidos:m.datos.partidos, ausencias:m.datos.ausencias, sust:m.datos.sust, km:m.datos.km, peajes:m.datos.peajes, obs:m.datos.obs }
  };
  $('#fNombre').textContent = `${m.nombre} ${m.ap1} ${m.ap2}`;
  $('#fSub').textContent = `${dm.mes} ${dm.anio} · ${titulo(dm.grupo)}`;
  pintarFicha();
  $('#guardar').classList.toggle('oculto', !!dm.cerrado);
  $('#ficha').classList.add('abierta'); $('#ficha').setAttribute('aria-hidden','false');
  $('#ficha').scrollTop = 0;
  try { history.pushState({ficha:1}, ''); } catch(e) {}
}

function cerrarFicha(desdeHistorial) {
  if (S.ficha && S.ficha.sucio && !confirm('Tienes cambios sin guardar. ¿Salir igualmente?')) {
    if (desdeHistorial) try { history.pushState({ficha:1}, ''); } catch(e) {}
    return;
  }
  S.ficha = null;
  $('#ficha').classList.remove('abierta'); $('#ficha').setAttribute('aria-hidden','true');
  try { if (!desdeHistorial && history.state && history.state.ficha) history.back(); } catch(e) {}
}
$('#cerrarFicha').onclick = () => cerrarFicha(false);
$('#fondoFicha').onclick = () => cerrarFicha(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ficha) cerrarFicha(false); });
window.addEventListener('popstate', () => { if (S.ficha) cerrarFicha(true); });

function pintarFicha() {
  const F = S.ficha, m = F.m, dm = S.datosMes, fest = dm.festivos;
  const hab = diasHabiles(dm.anio, dm.mesNum);
  const hoy = new Date(); const esHoyMes = hoy.getFullYear()===dm.anio && hoy.getMonth()+1===dm.mesNum;
  // rejilla L-V
  let celdas = DIAS_CORTOS.map((x,i) => `<div class="h ${m.fijos.includes(i)?'fijo':''}">${x}</div>`).join('');
  if (hab.length) celdas += '<div class="vacio-dia"></div>'.repeat(hab[0].wd);
  hab.forEach(h => {
    const cls = ['dia', m.fijos.includes(h.wd)?'fijo':'', F.sel.has(h.d)?'on':'', fest[h.d]?'fest':'', esHoyMes&&hoy.getDate()===h.d?'hoy':''].join(' ');
    celdas += `<button class="${cls}" data-d="${h.d}" ${dm.cerrado?'disabled':''} title="${esc(fest[h.d]||'')}">${h.d}${fest[h.d]?'<small>fest.</small>':''}</button>`;
  });
  const conteo = [0,0,0,0,0]; hab.forEach(h => { if (F.sel.has(h.d)) conteo[h.wd]++; });
  const sinMarcar = hab.filter(h => m.fijos.includes(h.wd) && !fest[h.d] && !F.sel.has(h.d)).length;
  const propuesta = !Array.isArray(m.dias);

  $('#fCuerpo').innerHTML = `
    <div class="tarjeta">
      <h3>Días que ha ido</h3>
      <p class="ayuda">${propuesta
        ? (m.estado==='enhoja' ? 'Marcado a partir de lo que ya había en la hoja. Revisa y guarda.' : 'Propuesta según sus días fijos. Desmarca los días que no fue y marca los extra.')
        : 'Toca un día para marcarlo o desmarcarlo.'}</p>
      <div class="cal">${celdas}</div>
      <div class="conteo">${DIAS_CORTOS.map((x,i)=>`<div><b>${conteo[i]}</b>${x}</div>`).join('')}</div>
      ${sinMarcar && !dm.cerrado ? `<div class="pista">${sinMarcar} día${sinMarcar>1?'s':''} fijo${sinMarcar>1?'s':''} sin marcar
          ${(F.v.ausencias||0) !== sinMarcar ? `<button id="usarAus">Poner en ausencias</button>`:''}</div>` : ''}
      <div class="leyenda"><span><i style="background:var(--azul)"></i>Ha ido</span><span><i style="border:2px solid #c9cfdd;background:var(--fondo)"></i>Día fijo</span><span><i style="background:repeating-linear-gradient(135deg,#f4f5f8 0 3px,#dfe2e8 3px 6px)"></i>Festivo</span></div>
    </div>

    <div class="tarjeta">
      <h3>Incidencias</h3>
      ${paso('partidos','Partidos de liga','')}
      ${paso('ausencias','Ausencias','Días que no fue')}
      ${paso('sust','Sustituciones','Veces que cubrió a otro')}
      <div class="campo"><div class="et">Km especiales<small>Formación, liga, partidos…</small></div>
        <div class="sufijo"><input class="num" inputmode="decimal" data-f="km" value="${fmt(F.v.km)}" placeholder="0" ${dm.cerrado?'disabled':''}>km</div></div>
      <div class="campo"><div class="et">Peajes</div>
        <div class="sufijo"><input class="num" inputmode="decimal" data-f="peajes" value="${fmt(F.v.peajes)}" placeholder="0,00" ${dm.cerrado?'disabled':''}>€</div></div>
    </div>

    <div class="tarjeta">
      <h3>Observaciones</h3>
      <p class="ayuda">Motivo de la ausencia, a quién sustituye y qué día, etc.</p>
      <div class="chips">${['Sustituye a ','Falta el ','Formación ','Comparte coche'].map(c=>`<button class="chip" data-chip="${c}">${c.trim()}…</button>`).join('')}</div>
      <textarea id="obs" placeholder="Ej.: Sustituye a Víctor en Griseras el 3/11" ${dm.cerrado?'disabled':''}>${esc(F.v.obs)}</textarea>
      ${m.actualizado ? `<div class="meta">Última vez guardado ${new Date(m.actualizado).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${m.por?' por '+esc(m.por):''}</div>`:''}
    </div>`;

  const cuerpo = $('#fCuerpo');
  cuerpo.querySelectorAll('.dia').forEach(b => b.onclick = () => {
    const d = +b.dataset.d; F.sel.has(d) ? F.sel.delete(d) : F.sel.add(d); F.sucio = true;
    const y = $('#ficha').scrollTop; pintarFicha(); $('#ficha').scrollTop = y;
    if (navigator.vibrate) navigator.vibrate(8);
  });
  cuerpo.querySelectorAll('[data-paso]').forEach(b => b.onclick = () => {
    const f = b.dataset.paso, delta = +b.dataset.delta;
    F.v[f] = Math.max(0, (F.v[f]||0) + delta); F.sucio = true;
    const y = $('#ficha').scrollTop; pintarFicha(); $('#ficha').scrollTop = y;
  });

  const obs = $('#obs'); obs.oninput = () => { F.v.obs = obs.value; F.sucio = true; };
  cuerpo.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => {
    obs.value = (obs.value.trim() ? obs.value.trim() + '. ' : '') + c.dataset.chip; F.v.obs = obs.value; F.sucio = true;

function paso(f, et, sub) {
  const dis = S.datosMes.cerrado ? 'disabled' : '';
  return `<div class="campo"><div class="et">${et}${sub?`<small>${sub}</small>`:''}</div>
    <div class="paso"><button data-paso="${f}" data-delta="-1" ${dis} aria-label="Restar">−</button><output>${S.ficha.v[f]||0}</output><button data-paso="${f}" data-delta="1" ${dis} aria-label="Sumar">+</button></div></div>`;
}
function fmt(v){ return v===null||v===undefined||v==='' ? '' : String(v).replace('.',','); }
function aNum(v){ if (v===null||v===undefined||v==='') return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }

$('#guardar').onclick = () => {
  const F = S.ficha, v = F.v, dm = S.datosMes, m = F.m;
  const dias = [...F.sel].sort((a,b)=>a-b);
  const conteo = [0,0,0,0,0]; dias.forEach(d => { const w = new Date(dm.anio, dm.mesNum-1, d).getDay(); if (w>=1&&w<=5) conteo[w-1]++; });
  const params = { mes:dm.mes, grupo:dm.grupo, key:m.key, dias,
    partidos: v.partidos||null, ausencias: v.ausencias||null, sust: v.sust||null, km: aNum(v.km), peajes: aNum(v.peajes), obs: v.obs||'' };
  // se actualiza al momento en el móvil...
  Object.assign(m, { dias, estado:'enviando', actualizado:new Date().toISOString(), por:S.user.persona });
  Object.assign(m.datos, { conteo, partidos:params.partidos, ausencias:params.ausencias, sust:params.sust, km:params.km, peajes:params.peajes, obs:params.obs });
  // ...y se envía por detrás (si ya había un envío pendiente del mismo monitor, se sustituye)
  S.cola = S.cola.filter(x => !(x.action === 'guardarMonitor' && x.params.mes === params.mes && x.params.grupo === params.grupo && x.params.key === params.key));
  S.cola.push({ action:'guardarMonitor', params, local: JSON.parse(JSON.stringify(m)) });
  guardarCola(); guardarCache();
  F.sucio = false; cerrarFicha(false); pintarLista();
  toast('Guardado ✓');
  enviarCola();
};

let enviando = false;
async function enviarCola() {
  if (enviando || !S.cola.length) return;
  enviando = true;
  try {
    while (S.cola.length) {
      const it = S.cola[0];
      try {
        const r = await api(it.action, it.params);
        S.cola.shift(); guardarCola();
        actualizarEstado(it, 'guardado', r && r.actualizado);
        marcarSinRed(false);
      } catch (e) {
        if (e.red) { marcarSinRed(true); break; }           // sin cobertura: se reintenta luego
        S.cola.shift(); guardarCola();
        actualizarEstado(it, 'error'); toast(e.message, true);
      }
    }
  } finally { enviando = false; guardarCache(); }
}
function actualizarEstado(it, estado, cuando) {
  if (it.action !== 'guardarMonitor') return;
  const d = S.datos[it.params.mes]; if (!d) return;
  const m = (d.grupos[it.params.grupo] || []).find(x => x.key === it.params.key);
  if (m) { m.estado = estado; if (cuando) m.actualizado = cuando; }
  if (!S.ficha && S.tab === 'monitores' && S.mes === it.params.mes) pintar();
}
window.addEventListener('online', enviarCola);
setInterval(enviarCola, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) { enviarCola(); cargar(); } });

/* ======================= MIS DATOS ======================= */
function pintarMisDatosDesdeCache() {
  const d = S.mis[S.mes + '|' + S.misResp];
  if (d) pintarMisDatos(d); else $('#main').innerHTML = '<div class="cargando"><div class="spin"></div></div>';
}
async function refrescarMisDatos(forzar) {
  const k = S.mes + '|' + S.misResp, d = S.mis[k];
  if (d && !forzar && Date.now() - (d._fresco||0) < 60000) return;
  if (S.cola.some(x => x.action === 'guardarMisDatos' && x.params.mes + '|' + x.params.responsable === k)) return;
  try {
    const n = await api('misDatos', { mes:S.mes, responsable:S.misResp }); n._fresco = Date.now();
    S.mis[k] = n; guardarCache();
    if (S.tab === 'mis' && S.mes + '|' + S.misResp === k) pintarMisDatos(n);
  } catch (e) { if (!d) $('#main').innerHTML = `<div class="vacio">${esc(e.message)}</div>`; }
}
function pintarMisDatos(d) {
  const main = $('#main'), dis = d.cerrado ? 'disabled' : '';
  const v = { km:d.km, partidos:d.partidos||0, sust:d.sust||0, peajes:d.peajes, obs:d.obs };
  const sel = S.user.responsables.length > 1
    ? `<div class="grupos">${S.user.responsables.map(r=>`<button class="grupo ${r===S.misResp?'on':''}" data-r="${esc(r)}">${imgMini(r)}${esc(r)}</button>`).join('')}</div>` : '';
  main.innerHTML = `
    ${sel}
    ${d.cerrado ? `<div class="aviso">🔒 ${esc(S.mes)} está cerrado.</div>` : ''}
    <div class="mis"><div class="tarjeta">
      <h3>${esc(d.responsable)} · ${esc(S.mes)}</h3>
      <p class="ayuda">Tus propios kilómetros, partidos y sustituciones del mes.</p>
      <div class="campo"><div class="et">Km totales del mes</div><div class="sufijo"><input class="num" id="mKm" inputmode="decimal" value="${fmt(v.km)}" placeholder="0" ${dis}>km</div></div>
      <div class="campo"><div class="et">Partidos de liga<small>Cubiertos sin otro monitor</small></div>
        <div class="paso"><button data-m="partidos" data-delta="-1" ${dis}>−</button><output id="o-partidos">${v.partidos}</output><button data-m="partidos" data-delta="1" ${dis}>+</button></div></div>
      <div class="campo"><div class="et">Sustituciones<small>+1 o −1</small></div>
        <div class="paso"><button data-m="sust" data-delta="-1" ${dis}>−</button><output id="o-sust">${v.sust}</output><button data-m="sust" data-delta="1" ${dis}>+</button></div></div>
      <div class="campo"><div class="et">Peajes</div><div class="sufijo"><input class="num" id="mPeajes" inputmode="decimal" value="${fmt(v.peajes)}" placeholder="0,00" ${dis}>€</div></div>
    </div>
    <div class="tarjeta">
      <h3>Observaciones</h3>
      <p class="ayuda">Detalle de viajes, sustituciones, material…</p>
      <textarea id="mObs" ${dis} placeholder="Ej.: 2 viajes Zizur - Ayegui - Zizur (159 km)">${esc(v.obs)}</textarea>
    </div></div>
    ${d.cerrado ? '' : '<button class="btn" id="mGuardar">Guardar mis datos</button>'}`;
  main.querySelectorAll('.grupo[data-r]').forEach(b => b.onclick = () => { S.misResp = b.dataset.r; cargar(); });
  main.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const f = b.dataset.m, min = f === 'sust' ? -99 : 0;
    v[f] = Math.max(min, (v[f]||0) + (+b.dataset.delta)); $('#o-'+f).textContent = v[f];
  });
  const g = $('#mGuardar');
  if (g) g.onclick = () => {
    const params = { mes:S.mes, responsable:d.responsable, km:aNum($('#mKm').value), partidos:v.partidos||null, sust:v.sust||null, peajes:aNum($('#mPeajes').value), obs:$('#mObs').value };
    S.mis[S.mes + '|' + d.responsable] = Object.assign({}, d, params, { _fresco: Date.now() });
    S.cola = S.cola.filter(x => !(x.action === 'guardarMisDatos' && x.params.mes === params.mes && x.params.responsable === params.responsable));
    S.cola.push({ action:'guardarMisDatos', params }); guardarCola(); guardarCache();
    toast('Guardado ✓'); enviarCola();
  };
}

/* ======================= MENÚ / INSTALAR ======================= */
let eventoInstalar = null;
const esStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function mostrarBannerInstalar() {
  if (esStandalone() || (window.google && google.script)) return;
  const quitado = +store.get('inc_inst_no') || 0;
  if (Date.now() - quitado < 3 * 864e5) return;                 // si dijo "ahora no", volver a sugerir en 3 días
  if (eventoInstalar) {
    $('#instTx').innerHTML = '<b>Instala la app</b>Ábrela desde la pantalla de inicio como una app más.';
    $('#instSi').classList.remove('oculto');
  } else if (esIOS()) {
    const safari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    $('#instTx').innerHTML = safari
      ? '<b>Instala la app en tu iPhone</b>Pulsa <b style="display:inline">Compartir</b> <svg width="14" height="16" viewBox="0 0 14 18" style="vertical-align:-2px"><path d="M7 1v11M3 5l4-4 4 4M1 9v8h12V9" fill="none" stroke="#1d4ed8" stroke-width="1.8"/></svg> abajo y luego <b style="display:inline">«Añadir a pantalla de inicio»</b>.'
      : '<b>Instala la app en tu iPhone</b>Abre este enlace en <b style="display:inline">Safari</b> y pulsa Compartir → «Añadir a pantalla de inicio».';
    $('#instSi').classList.add('oculto');
  } else return;
  $('#instalarBanner').classList.remove('oculto'); document.body.classList.add('conBanner');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; mostrarBannerInstalar(); });
window.addEventListener('appinstalled', () => { $('#instalarBanner').classList.add('oculto'); eventoInstalar = null; });
$('#instSi').onclick = async () => { $('#instalarBanner').classList.add('oculto'); document.body.classList.remove('conBanner'); if (eventoInstalar) { eventoInstalar.prompt(); eventoInstalar = null; } };
$('#instNo').onclick = () => { $('#instalarBanner').classList.add('oculto'); document.body.classList.remove('conBanner'); store.set('inc_inst_no', Date.now()); };
setTimeout(mostrarBannerInstalar, 1200);
$('#btnMenu').onclick = () => {
  $('#menuInfo').innerHTML = `Conectado como <b>${esc(S.user.persona)}</b>${S.user.admin?' (administración)':''}.<br>Grupos: ${S.user.grupos.map(g=>esc(titulo(g))).join(', ')}`;
  $('#instalar').classList.toggle('oculto', esStandalone());
  $('#menu').classList.remove('oculto');
};
$('#menu').onclick = e => { if (e.target.id === 'menu') $('#menu').classList.add('oculto'); };
$('#recargar').onclick = () => { $('#menu').classList.add('oculto'); enviarCola(); cargar(true); };
$('#instalar').onclick = async () => {
  $('#menu').classList.add('oculto');
  if (eventoInstalar) { eventoInstalar.prompt(); eventoInstalar = null; return; }
  store.del('inc_inst_no'); mostrarBannerInstalar();
  if ($('#instalarBanner').classList.contains('oculto')) toast('Usa el menú del navegador → «Añadir a pantalla de inicio»');
};
$('#salir').onclick = () => {
  if (S.cola.length && !confirm('Hay ' + S.cola.length + ' cambio(s) sin enviar todavía. ¿Cerrar sesión igualmente?')) return;
  store.del('inc_codigo'); store.del('inc_cache_'+S.codigo); store.del('inc_cola_'+S.codigo); location.reload();
};

/* ======================= ARRANQUE ======================= */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !(window.google && google.script)) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
(function(){
  const url = new URLSearchParams(location.search).get('c');   // enlace directo: ...?c=CODIGO
  const guardado = url || store.get('inc_codigo');
  if (guardado) { $('#codigo').value = guardado; entrar(guardado, !url); }
})();
</script>
</body>

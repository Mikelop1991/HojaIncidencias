<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Incidencias">
<title>Incidencias Escuela 26-27</title>
<script src="config.js?v=9"></script>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>
/* tema: automático (según el móvil) / claro / oscuro — se aplica antes de pintar para no parpadear */
(function(){
  function aplicar(){
    var t = 'auto'; try { t = localStorage.getItem('inc_tema') || 'auto'; } catch(e){}
    var osc = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-tema', osc ? 'oscuro' : 'claro');
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', osc ? '#0a0f1b' : '#b3121f');
  }
  window.aplicarTema = aplicar; aplicar();
  if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicar); } catch(e){}
})();
</script>
<style>
:root{
  --rojo:#b3121f; --rojo-2:#d4202f; --rojo-suave:#fdecee;
  --azul:#16213a; --tinta:#1b1f29; --gris:#6b7280; --linea:#e6e8ee; --fondo:#f4f5f8; --blanco:#fff;
  --verde:#15803d; --verde-suave:#e7f6ec; --ambar:#b45309; --ambar-suave:#fff4e0;
  --radio:16px; --sombra:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --card:#fff; --pista:#f1f2f5; --borde-fijo:#c9cfdd; --texto-azul:var(--azul); --cab:#16213a;
  --c-aus:#c8102e; --c-sus:#2f5aa8; --toast:#1b1f29; --rec-bg:#fff4e0; --rec-tx:#7c4a03; --rec-tx2:#92600a;
  color-scheme:light;
}
:root[data-tema="oscuro"]{
  --fondo:#0d1220; --card:#161e30; --tinta:#e7eaf1; --gris:#98a1b3; --linea:#283149; --pista:#222b40; --borde-fijo:#3a4562;
  --azul:#2d4a86; --texto-azul:#b9c9f2; --cab:#0a0f1b; --blanco:#161e30;
  --rojo-suave:rgba(229,72,77,.16); --verde:#3ccf74; --verde-suave:rgba(60,207,116,.14); --ambar:#f5b44a; --ambar-suave:rgba(245,180,74,.14);
  --c-aus:#e5484d; --c-sus:#5b8def; --toast:#2a3349; --rec-bg:rgba(245,180,74,.14); --rec-tx:#f7cf86; --rec-tx2:#e2b66a;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.oculto{display:none!important}

/* ---------- login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  background:linear-gradient(160deg,var(--rojo) 0%,#7d0b15 100%);color:#fff}
#login{background:linear-gradient(180deg,var(--rojo) 0%,var(--rojo) 45%,#7d0b15 100%);justify-content:flex-start;padding-top:0}
.portada{position:relative;margin:0 -24px 26px;padding-top:env(safe-area-inset-top);background:#7d0b15}
.portada img{display:block;width:100%;height:auto}
.portada::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:45%;background:linear-gradient(180deg,rgba(179,18,31,0),var(--rojo))}
#login .relleno{flex:1}
#login .marca{font-weight:800;letter-spacing:.08em;font-size:13px;opacity:.85;text-transform:uppercase}
#login h1{font-size:34px;line-height:1.1;margin:8px 0 6px}
#login p{opacity:.85;margin:0 0 28px}
#login .caja{background:var(--card);color:var(--tinta);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#login label{font-size:13px;font-weight:600;color:var(--gris)}
#codigo{width:100%;margin:8px 0 14px;padding:14px 16px;border:2px solid var(--linea);border-radius:12px;font-size:24px;letter-spacing:.3em;text-transform:uppercase;text-align:center;outline:none}
#codigo:focus{border-color:var(--rojo)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--rojo);color:#fff;font-weight:700;font-size:17px}
.btn:active{transform:scale(.99);background:#9a0f1a}
.btn[disabled]{opacity:.5}
.btn.sec{background:var(--card);color:var(--tinta);border:1.5px solid var(--linea)}
.err{color:var(--rojo);font-size:14px;min-height:20px;margin-top:10px;text-align:center}

/* ---------- cabecera */
header{position:sticky;top:0;z-index:5;background:var(--cab);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.yo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);flex:none;background:#2a3655}
.quienwrap{display:flex;align-items:center;gap:12px}
.mini{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:-4px 6px -4px -4px}
.top .hola{font-size:13px;opacity:.7}
.top .quien{font-weight:700;font-size:18px}
.icono{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.meses{display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.mes{flex:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:14px;scroll-snap-align:center}
.mes.on{background:var(--card);color:var(--texto-azul)}
.mes .cand{font-size:11px;margin-left:4px;opacity:.7}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:12px 0 13px;color:rgba(255,255,255,.65);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--rojo-2)}

main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.grupos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grupo{padding:8px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--linea);font-size:13px;font-weight:600}
.grupo.on{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-suave)}
.resumen{background:var(--card);border-radius:var(--radio);padding:14px 16px;box-shadow:var(--sombra);margin-bottom:12px}
.resumen .fila{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--gris)}
.resumen b{color:var(--tinta);font-size:20px}
.barra{height:8px;border-radius:99px;background:var(--linea);margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.aviso{background:var(--ambar-suave);color:var(--ambar);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.buscar{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linea);background:var(--card);margin-bottom:10px;outline:none}
.buscar:focus{border-color:var(--azul)}

.lista{display:flex;flex-direction:column;gap:8px}
.mon{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sombra)}
.mon:active{filter:brightness(.97)}
.av{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--fondo);color:var(--texto-azul);font-size:15px}
.mon .info{flex:1;min-width:0}
.mon .nom{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .sub{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.d{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--fondo);color:var(--gris)}
.d.fijo{background:var(--azul);color:#fff}
.estado{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.estado.guardado{background:var(--verde-suave);color:var(--verde)}
.estado.pendiente{background:var(--fondo);color:var(--gris)}
.estado.enhoja{background:var(--ambar-suave);color:var(--ambar)}
.estado.enviando{background:#e8eefc;color:#1d4ed8}
.estado.error{background:var(--rojo-suave);color:var(--rojo)}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}

/* ---------- ficha */
#ficha{position:fixed;inset:0;z-index:20;background:var(--fondo);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;}
#ficha.abierta{transform:none;visibility:visible;transition:transform .25s ease}
.fcab{position:sticky;top:0;z-index:2;background:var(--card);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea)}
.fcab .icono{background:var(--fondo);color:var(--tinta)}
.fcab .t{flex:1;min-width:0}
.fcab .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcab .t span{font-size:13px;color:var(--gris)}
.fcuerpo{padding:14px 14px 10px;max-width:680px;margin:0 auto}
.tarjeta{background:var(--card);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
.tarjeta h3{margin:0 0 4px;font-size:15px}
.tarjeta .ayuda{font-size:13px;color:var(--gris);margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--gris);padding:2px 0 4px}
.cal .h.fijo{color:var(--texto-azul)}
.dia{aspect-ratio:1/0.9;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--fondo);color:var(--gris);border:2px solid transparent;position:relative}
.dia.fijo{border-color:var(--borde-fijo);color:var(--texto-azul)}
.dia.on{background:var(--azul);border-color:var(--azul);color:#fff}
.dia.fest{background:repeating-linear-gradient(135deg,var(--fondo) 0 6px,var(--linea) 6px 12px);color:var(--gris);opacity:.8}
.dia.fest.on{background:var(--azul);color:#fff}
.dia small{font-size:9px;font-weight:600;line-height:1;margin-top:2px;opacity:.8}
.dia.hoy::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--rojo-2)}
.vacio-dia{visibility:hidden}
.conteo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;text-align:center}
.conteo div{font-size:12px;color:var(--gris)}
.conteo b{display:block;font-size:20px;color:var(--tinta)}
.pista{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--ambar-suave);color:var(--ambar);padding:10px 12px;border-radius:12px;font-size:14px}
.pista button{margin-left:auto;font-weight:700;color:var(--ambar);text-decoration:underline;font-size:14px;flex:none}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--gris);margin-top:10px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

.campo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.campo:first-of-type{border-top:0}
.campo .et{font-weight:600;font-size:15px}
.campo .et small{display:block;font-weight:400;color:var(--gris);font-size:12px}
.paso{display:flex;align-items:center;gap:4px;flex:none}
.paso button{width:40px;height:40px;border-radius:12px;background:var(--fondo);font-size:22px;font-weight:700;color:var(--texto-azul)}
.paso button:active{filter:brightness(.92)}
.paso output{min-width:36px;text-align:center;font-size:20px;font-weight:700}
.num{width:110px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:12px;text-align:right;font-size:17px;font-weight:600;outline:none}
.num:focus,textarea:focus{border-color:var(--azul)}
.sufijo{display:flex;align-items:center;gap:6px;color:var(--gris);font-weight:600}
textarea{width:100%;min-height:96px;padding:12px;border:1.5px solid var(--linea);border-radius:12px;resize:vertical;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 10px;border-radius:999px;background:var(--fondo);font-size:13px;font-weight:600;color:var(--texto-azul)}
.meta{font-size:12px;color:var(--gris);text-align:center;margin-top:6px}

.pie{position:sticky;bottom:0;z-index:3;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--fondo) 70%,transparent)}
.pie .btn{max-width:652px;margin:0 auto;box-shadow:0 6px 18px rgba(179,18,31,.3)}

#toast{color:#fff!important;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--toast);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
body.conBanner #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
#toast.si{opacity:1;transform:translateX(-50%)}
#toast.mal{background:var(--rojo)}
.cargando{display:flex;justify-content:center;padding:40px}
.spin{width:28px;height:28px;border:3px solid var(--linea);border-top-color:var(--rojo);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

.conex{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);color:#fff}
.conex i{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:none}
.conex.ok i{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.conex.envia i{background:#60a5fa;animation:lat 1s infinite}
.conex.mal i{background:#f87171}
@keyframes lat{50%{opacity:.3}}
#instalarBanner{color:var(--tinta)!important;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;background:var(--card);color:var(--tinta);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px;display:flex;gap:12px;align-items:center;max-width:520px;margin:0 auto}
#instalarBanner img{width:44px;height:44px;border-radius:10px;flex:none}
#instalarBanner .tx{flex:1;font-size:14px;line-height:1.35}
#instalarBanner .tx b{display:block;font-size:15px}
#instalarBanner .acc{display:flex;flex-direction:column;gap:6px;flex:none}
#instalarBanner .acc button{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px}
#instalarBanner .si{background:var(--rojo);color:#fff}
#instalarBanner .no{color:var(--gris);font-size:13px!important;padding:4px!important}
#menu{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#menu .hoja{background:var(--card);color:var(--tinta);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.temas{display:flex;gap:6px;background:var(--fondo);padding:4px;border-radius:12px;margin-bottom:6px}
.temas button{flex:1;padding:10px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--gris)}
.temas button.on{background:var(--card);color:var(--tinta);box-shadow:var(--sombra)}
#menu .hoja p{margin:0 0 14px;color:var(--gris);font-size:14px}
#menu .hoja .btn{margin-top:8px}

#fondoFicha{position:fixed;inset:0;z-index:19;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .25s}
/* ---------- ordenador / tablet */
@media (min-width:900px){
  .portada,#login .relleno{display:none}
  #login{align-items:flex-end;justify-content:center;padding-right:7vw;background:linear-gradient(90deg,rgba(179,18,31,0) 0,rgba(179,18,31,0) 48%,var(--rojo) 56%),url(fotos/equipo.jpg) left center/56% auto no-repeat,linear-gradient(160deg,var(--rojo),#7d0b15)}
  #login>*{width:100%;max-width:440px}
  header{padding-left:32px;padding-right:32px}
  header>*{max-width:1240px;margin-left:auto;margin-right:auto}
  .tabs{justify-content:flex-start;gap:24px}
  .tab{flex:none;padding:12px 6px 13px}
  main{max-width:1240px;padding:22px 32px 40px}
  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .resumen-fila{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
  .resumen-fila .buscar{margin:0;height:100%}
  .mon:hover{box-shadow:0 0 0 2px var(--azul) inset,var(--sombra)}
  #ficha{left:auto;width:min(900px,70vw);transform:translateX(100%);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  #ficha.abierta{transform:none;visibility:visible;transition:transform .25s ease}
  #ficha.abierta+#fondoFicha{opacity:1;pointer-events:auto}
  .fcuerpo{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;padding:18px}
  .fcuerpo .tarjeta{margin:0}
  .fcuerpo .tarjeta:first-child{grid-row:span 2}
  .pie .btn{max-width:340px;margin:0 0 0 auto}
  .dia{aspect-ratio:auto;height:54px}
  .dia:hover{filter:brightness(.96)}
  .mis{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .mis .tarjeta{margin:0}
  #mGuardar{max-width:340px;margin:14px 0 0 auto}
  #toast{bottom:28px}
}
@media (min-width:900px) and (max-width:1150px){ .fcuerpo{grid-template-columns:1fr} .fcuerpo .tarjeta:first-child{grid-row:auto} }

/* ---------- bloqueo de meses (administración) */
.bloqueo{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sombra);border-left:4px solid var(--verde);font-size:14px}
.bloqueo.on{border-left-color:var(--rojo)}
.bloqueo div{flex:1}.bloqueo span{color:var(--gris);font-size:12px}
.bloqueo button{flex:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px;background:var(--rojo);color:#fff}
.bloqueo.on button{background:var(--verde);color:#fff}
.meses-bloq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meses-bloq button{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--fondo);color:var(--tinta);border:1.5px solid var(--linea)}
.meses-bloq button.on{background:var(--rojo-suave);color:var(--rojo);border-color:var(--rojo)}
/* ---------- confirmación rápida y recordatorios */
.rapido{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--borde-fijo);color:var(--gris);font-size:20px;font-weight:800;display:grid;place-items:center;background:var(--card)}
.rapido:hover,.rapido:active{border-color:var(--verde);color:#fff;background:var(--verde)}
.lote-ok{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--verde-suave);color:var(--verde);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.lote-ok .lote-btn{flex:none;background:var(--verde);color:#fff;font-weight:800;padding:9px 12px;border-radius:10px;font-size:13px}
.recordatorio{display:flex;gap:10px;align-items:flex-start;background:var(--rec-bg);color:var(--rec-tx);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;border-left:4px solid #f59e0b}
.recordatorio span{color:var(--rec-tx2);font-size:13px}
.contactos{display:flex;flex-direction:column;gap:8px}
.contacto{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
.contacto:first-child{border-top:0}
.contacto img,.contacto .ini{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--fondo);display:grid;place-items:center;font-weight:700;color:var(--texto-azul);font-size:13px}
.contacto .nm{flex:1;min-width:0}
.contacto .nm b{display:block;font-size:14px}
.contacto .nm span{font-size:12px;color:var(--gris)}
.wa{flex:none;display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;text-decoration:none}

/* ---------- cabecera del informe */

  <div class="caja">

<script>
/* ============================================================
   CONFIGURACIÓN — pega aquí la URL de la implementación web
   de Apps Script (termina en /exec). Solo hace falta si la app
   se aloja fuera de Google (GitHub Pages, Netlify...).
   ============================================================ */
const API_URL = window.API_URL || '';

const DIAS_CORTOS = ['L','M','X','J','V'];
const DIAS_LARGOS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const MESES_NUM = {Octubre:10,Noviembre:11,Diciembre:12,Enero:1,Febrero:2,Marzo:3,Abril:4,Mayo:5,Junio:6};

const S = { codigo:null, user:null, mes:null, grupo:null, tab:'monitores', datos:{}, mis:{}, filtro:'', ficha:null, misResp:null, cola:[] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- almacenamiento (puede fallar en algunos navegadores) */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} },
  getJ(k){ try{ return JSON.parse(this.get(k)) }catch(e){ return null } },
  setJ(k,v){ this.set(k, JSON.stringify(v)); }
};
function guardarCache(){ if (S.codigo) store.setJ('inc_cache_'+S.codigo, { user:S.user, datos:S.datos, mis:S.mis }); }
function guardarCola(){ if (S.codigo) store.setJ('inc_cola_'+S.codigo, S.cola); if (typeof estadoConexion === 'function') estadoConexion(); }

/* ---------- llamada a la API: google.script.run si estamos dentro de Apps Script, fetch si no */
function api(action, params = {}) {
  const body = Object.assign({ action, codigo: S.codigo }, params);
  const fallo = (m, red) => { const e = new Error(m); e.red = !!red; return e; };
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ko) => google.script.run
      .withSuccessHandler(r => { const j = JSON.parse(r); j.ok ? ok(j.data) : ko(fallo(j.error)); })
      .withFailureHandler(e => ko(fallo(e && e.message || 'Error de conexión', true)))
      .apiRun(action, JSON.stringify(body)));
  }
  if (window.API_MOCK) return window.API_MOCK(body);
  if (!API_URL) return Promise.reject(fallo('La app aún no está conectada a la hoja (falta la URL en config.js).'));
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(r => r.json(), () => { throw fallo('Sin conexión. Se enviará cuando vuelva la cobertura.', true); })
    .then(j => { if (!j.ok) throw fallo(j.error); return j.data; });
}

function toast(msg, mal) {
  const t = $('#toast'); t.textContent = msg; t.className = 'si' + (mal ? ' mal' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2600);
}

/* ---------- fotos de perfil (carpeta fotos/, nombre-apellido.jpg) */
const slug = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().split(/\s+/).slice(0,2).join('-');
const fotoDe = nombre => 'fotos/' + (/^administraci/i.test(nombre) ? 'mikel-lopez' : slug(nombre)) + '.jpg';
function imgMini(nombre){ return `<img class="mini" src="${fotoDe(nombre)}" alt="" onerror="this.remove()">`; }

/* ======================= LOGIN ======================= */
function mostrarApp() {
  const u = S.user;
  if (!u.meses.includes(S.mes)) S.mes = u.mesActual;
  if (!u.grupos.includes(S.grupo)) S.grupo = u.grupos[0];
  if (!u.responsables.includes(S.misResp)) S.misResp = u.responsables[0] || null;
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#quien').textContent = u.persona;
  const yo = $('#yo'); yo.onerror = () => yo.classList.add('oculto'); yo.onload = () => yo.classList.remove('oculto'); yo.src = fotoDe(u.persona);
  $('#tabMis').classList.toggle('oculto', !u.responsables.length);
  $('#tabRes').classList.toggle('oculto', !u.admin);
  pintarMeses();
}

async function entrar(codigo, silencioso) {
  const btn = $('#entrar');
  btn.disabled = true; $('#loginErr').textContent = '';
  S.codigo = codigo.trim().toUpperCase();
  S.mes = store.get('inc_mes'); S.grupo = store.get('inc_grupo');
  S.cola = store.getJ('inc_cola_'+S.codigo) || [];
  S._ayudaRapido = !!store.get('inc_ayuda_rapido');
  // 1) si hay datos guardados en el móvil, se ve todo al instante
  const c = store.getJ('inc_cache_'+S.codigo);
  if (c && c.user) { S.user = c.user; S.datos = c.datos || {}; S.mis = c.mis || {}; mostrarApp(); pintar(); }
  // 2) en una sola llamada: comprobar código + datos del mes
  try {
    let u, datos;
    try { u = await api('inicio', { mes: S.mes }); datos = u.datos; delete u.datos; }
    catch (e) {
      if (!/Acci[oó]n desconocida/.test(e.message)) throw e;
      S.antiguo = true; u = await api('login');                  // servidor de la versión anterior
      datos = await pedirMes(S.mes && u.meses.includes(S.mes) ? S.mes : u.mesActual, u);
    }
    S.user = u; S.datos[datos.mes] = fusionar(datos);
    if (!S.mes || !u.meses.includes(S.mes)) S.mes = datos.mes;
    store.set('inc_codigo', S.codigo); guardarCache();
    mostrarApp(); pintar(); marcarSinRed(false); actualizarAvisos();
    enviarCola();
    precargar().then(() => { if (S.user.admin) refrescarResumen(); });
  } catch (e) {
    if (e.red && S.user) { marcarSinRed(true); return; }
    S.user = null; $('#app').classList.add('oculto'); $('#login').classList.remove('oculto');
    if (!silencioso || !e.red) $('#loginErr').textContent = e.message;
    if (!e.red) { store.del('inc_codigo'); store.del('inc_cache_'+S.codigo); }
  } finally { btn.disabled = false; }
}
$('#entrar').onclick = () => entrar($('#codigo').value);
$('#codigo').addEventListener('keydown', e => { if (e.key === 'Enter') entrar($('#codigo').value); });

/** Pide los datos de un mes (todos los grupos). Con el servidor antiguo, grupo a grupo. */
async function pedirMes(mes, u) {
  if (!S.antiguo) return api('mes', { mes });
  u = u || S.user;
  const partes = await Promise.all(u.grupos.map(g => api('mes', { mes, grupo:g })));
  const d = Object.assign({}, partes[0], { grupos:{} }); partes.forEach((p, i) => d.grupos[u.grupos[i]] = p.monitores);
  return d;
}

/** Descarga en segundo plano el resto de meses para que cambiar de mes sea instantáneo. */
async function precargar() {
  for (const m of S.user.meses.slice().reverse()) {
    if (S.datos[m] && S.datos[m]._fresco) continue;
    try { const d = await pedirMes(m); S.datos[m] = fusionar(d); guardarCache(); } catch (e) { return; }
  }
}

/** Mantiene los cambios locales que aún no se han enviado. */
function fusionar(d) {
  d._fresco = Date.now();
  S.cola.filter(x => x.action === 'guardarMonitor' && x.params.mes === d.mes).forEach(x => {
    const lista = d.grupos[x.params.grupo] || [];
    const i = lista.findIndex(m => m.key === x.params.key);
    if (i >= 0 && x.local) lista[i] = Object.assign({}, x.local, { estado:'enviando' });
  });
  return d;
}

/* ---------- indicador de conexión con el Excel */
let ultimaOk = null, sinRed = false;
function estadoConexion() {
  const b = $('#conexion'); if (!b) return;
  const n = S.cola.length;
  let cls = '', txt = 'Conectando…';
  if (sinRed) { cls = 'mal'; txt = n ? `Sin conexión · ${n} pendiente${n>1?'s':''}` : 'Sin conexión'; }
  else if (n) { cls = 'envia'; txt = `Enviando ${n} cambio${n>1?'s':''}…`; }
  else if (ultimaOk) { cls = 'ok'; txt = 'Conectado al Excel'; }
  b.className = 'conex ' + cls; b.querySelector('span').textContent = txt;
}
function marcarSinRed(si) { sinRed = !!si; if (!si) ultimaOk = new Date(); estadoConexion(); }
$('#conexion').onclick = () => {
  toast(sinRed ? 'Sin conexión con el Excel. Los cambios se guardan en el móvil y se enviarán solos.'
    : S.cola.length ? 'Enviando cambios al Excel…'
    : ultimaOk ? 'Todo guardado en el Excel ✓ (última comprobación ' + ultimaOk.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) + ')' : 'Comprobando conexión…');
  enviarCola(); cargar(true);
};

/* ======================= CABECERA ======================= */
function pintarMeses() {
  const c = $('#meses');
  c.innerHTML = S.user.meses.map(m => `<button class="mes ${m===S.mes?'on':''}" data-m="${m}">${m}${S.user.cerrados.includes(m)?'<span class="cand">🔒</span>':''}</button>`).join('');
  c.querySelectorAll('.mes').forEach(b => b.onclick = () => { S.mes = b.dataset.m; store.set('inc_mes', S.mes); S.filtro=''; pintarMeses(); cargar(); });
  const on = c.querySelector('.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {

/* ======================= LISTA DE MONITORES ======================= */
/** Pinta lo que haya en el móvil y, si hace falta, lo refresca por detrás. */
function pintar() {
  $('#meses').classList.toggle('oculto', S.tab === 'resumen');
  if (S.tab === 'resumen') return pintarResumen();
  if (S.tab === 'mis') return pintarMisDatosDesdeCache();
  const d = S.datos[S.mes];
  if (d) { S.datosMes = vista(d); pintarLista(); }
  else $('#main').innerHTML = '<div class="cargando"><div class="spin"></div></div>';
}
/** ¿No se puede editar? (administración siempre puede) */
const bloq = d => !!(d && d.cerrado && !(S.user && S.user.admin));
function vista(d) { return Object.assign({}, d, { grupo:S.grupo, monitores:(d.grupos[S.grupo] || []) }); }

async function cargar(forzar) {
  pintar();
  const mes = S.mes, tab = S.tab, d = S.datos[mes];
  if (tab === 'mis') return refrescarMisDatos(forzar);
  if (tab === 'resumen') return refrescarResumen(forzar);
  if (d && !forzar && Date.now() - d._fresco < 60000) return;     // reciente: no hace falta volver a pedir
  try {
    const nuevo = fusionar(await pedirMes(mes));
    S.datos[mes] = nuevo; guardarCache(); marcarSinRed(false);
    if (S.mes === mes && S.tab === 'monitores' && !S.ficha) pintar();
  } catch (e) {
    if (e.red) marcarSinRed(true);
    if (!S.datos[mes]) $('#main').innerHTML = `<div class="vacio">${esc(e.message)}<br><br><button class="btn sec" onclick="cargar(true)">Reintentar</button></div>`;
    else if (!e.red) toast(e.message, true);
  }
}

function iniciales(m){ return ((m.nombre[0]||'') + (m.ap1[0]||'')).toUpperCase(); }

/** Guarda uno o varios monitores con su propuesta (días fijos sin festivos) y sin incidencias. */
function confirmarSinIncidencias(lista) {
  const dm = S.datosMes;
  lista.forEach(m => {
    const dias = [...seleccionInicial(m, dm)].sort((a,b)=>a-b);
    const conteo = [0,0,0,0,0]; dias.forEach(x => { const w = new Date(dm.anio, dm.mesNum-1, x).getDay(); if (w>=1&&w<=5) conteo[w-1]++; });
    const v = m.datos || {};
    const params = { mes:dm.mes, grupo:dm.grupo, key:m.key, dias, partidos:v.partidos??null, ausencias:v.ausencias??null, sust:v.sust??null, km:v.km??null, peajes:v.peajes??null, obs:v.obs||'' };
    Object.assign(m, { dias, estado:'enviando', actualizado:new Date().toISOString(), por:S.user.persona });
    Object.assign(m.datos, { conteo });
    S.cola = S.cola.filter(x => !(x.action === 'guardarMonitor' && x.params.mes === params.mes && x.params.grupo === params.grupo && x.params.key === params.key));
    S.cola.push({ action:'guardarMonitor', params, local: JSON.parse(JSON.stringify(m)) });
  });
  S._ayudaRapido = true; store.set('inc_ayuda_rapido', '1');
  guardarCola(); guardarCache(); pintarLista();
  toast(lista.length > 1 ? `${lista.length} monitores confirmados ✓` : 'Confirmado ✓');
  enviarCola();
}

/** Bloquear / desbloquear meses (solo administración). */
async function bloquearMeses(meses, cerrar) {
  if (cerrar && !confirm(`¿Bloquear ${meses.join(', ')}? Los responsables podrán consultar pero no modificar nada.`)) return;
  try {
    const r = await api('bloquear', { meses, cerrar });
    S.user.cerrados = r.cerrados;
    Object.values(S.datos).forEach(d => { if (d) d.cerrado = r.cerrados.includes(d.mes); });
    S.mis = {};
    guardarCache(); pintarMeses(); pintar();
    toast(cerrar ? '🔒 Bloqueado' : '🔓 Desbloqueado');
  } catch (e) {
    toast(/Acci[oó]n desconocida/.test(e.message) ? 'Actualiza el código de Apps Script para usar el bloqueo' : e.message, true);
  }
}

/* ---------- recordatorios dentro de la app */
function pendientesDe(d) { return Object.values(d.grupos || {}).flat().filter(m => m.estado === 'pendiente' || m.estado === 'error').length; }
function avisoPendientes(d) {
  if (d.cerrado) return '';
  const n = (d.monitores || []).filter(m => m.estado === 'pendiente' || m.estado === 'error').length;
  if (!n) return '';
  const hoy = new Date(), mesHoy = hoy.getMonth() + 1, esteMes = mesHoy === d.mesNum;
  const pasado = !esteMes && (d.anio < hoy.getFullYear() || (d.anio === hoy.getFullYear() && d.mesNum < mesHoy));
  const finMes = esteMes && hoy.getDate() >= new Date(d.anio, d.mesNum, 0).getDate() - 6;
  if (!pasado && !finMes) return '';
  return `<div class="recordatorio">⏰ <div><b>${pasado ? `Quedan ${n} monitores sin revisar de ${d.mes}` : `Se acaba ${d.mes}: quedan ${n} por revisar`}</b><br>
    <span>${pasado ? 'Complétalos cuanto antes para poder enviarlo a la asesoría.' : 'Puedes confirmar con ✓ los que no tengan incidencias.'}</span></div></div>`;
}
/** Número en el icono de la app (Android/Chrome/Edge y iPhone con la app instalada). */
function actualizarAvisos() {
  try {
    const hoy = new Date(); let n = 0;
    Object.values(S.datos).forEach(d => {
      if (!d || d.cerrado) return;
      const pasado = d.anio < hoy.getFullYear() || (d.anio === hoy.getFullYear() && d.mesNum < hoy.getMonth() + 1);
      const fin = d.anio === hoy.getFullYear() && d.mesNum === hoy.getMonth() + 1 && hoy.getDate() >= new Date(d.anio, d.mesNum, 0).getDate() - 6;
      if (pasado || fin) n += pendientesDe(d);
    });
    if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge();
  } catch (e) {}
}

function titulo(s){ return String(s).toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()); }

/* ======================= CALENDARIO ======================= */
function diasHabiles(anio, mes) {           // [{d, wd(0=L..4=V)}]
  const n = new Date(anio, mes, 0).getDate(), out = [];
  for (let d = 1; d <= n; d++) { const w = new Date(anio, mes-1, d).getDay(); if (w>=1 && w<=5) out.push({d, wd:w-1}); }
  return out;
}

/** Días que aparecen marcados al abrir la ficha. */
function seleccionInicial(m, dm) {
  if (Array.isArray(m.dias)) return new Set(m.dias);
  const hab = diasHabiles(dm.anio, dm.mesNum), fest = dm.festivos, sel = new Set();
  const legacy = m.datos.conteo.some(v => typeof v === 'number');
  if (legacy) {                                  // reconstruir desde los números que ya hay en la hoja
    m.datos.conteo.forEach((v, i) => {
      if (v === 'x' || v === 'X') { hab.filter(h => h.wd===i && !fest[h.d]).forEach(h => sel.add(h.d)); return; }
      if (typeof v !== 'number' || v <= 0) return;
      const cand = hab.filter(h => h.wd===i && !fest[h.d]).concat(hab.filter(h => h.wd===i && fest[h.d]));
      cand.slice(0, v).forEach(h => sel.add(h.d));
    });
  } else {
    hab.forEach(h => { if ((m.fijos.includes(h.wd) || m.datos.conteo[h.wd]) && !fest[h.d]) sel.add(h.d); });
  }
  return sel;
}

/* ======================= FICHA ======================= */
function abrirFicha(m) {
  const dm = S.datosMes;
  S.ficha = {
    m, sel: seleccionInicial(m, dm), sucio: false,
    v: { partidos:m.datos.partidos, ausencias:m.datos.ausencias, sust:m.datos.sust, km:m.datos.km, peajes:m.datos.peajes, obs:m.datos.obs }
  };
  $('#fNombre').textContent = `${m.nombre} ${m.ap1} ${m.ap2}`;
  $('#fSub').textContent = `${dm.mes} ${dm.anio} · ${titulo(dm.grupo)}`;
  pintarFicha();
  $('#guardar').classList.toggle('oculto', bloq(dm));
  $('#ficha').classList.add('abierta'); $('#ficha').setAttribute('aria-hidden','false');
  $('#ficha').scrollTop = 0;
  try { history.pushState({ficha:1}, ''); } catch(e) {}
}

function cerrarFicha(desdeHistorial) {
  if (S.ficha && S.ficha.sucio && !confirm('Tienes cambios sin guardar. ¿Salir igualmente?')) {
    if (desdeHistorial) try { history.pushState({ficha:1}, ''); } catch(e) {}
    return;
  }
  S.ficha = null;
  $('#ficha').classList.remove('abierta'); $('#ficha').setAttribute('aria-hidden','true');
  try { if (!desdeHistorial && history.state && history.state.ficha) history.back(); } catch(e) {}
}
$('#cerrarFicha').onclick = () => cerrarFicha(false);
$('#fondoFicha').onclick = () => cerrarFicha(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ficha) cerrarFicha(false); });
window.addEventListener('popstate', () => { if (S.ficha) cerrarFicha(true); });

function pintarFicha() {
  const F = S.ficha, m = F.m, dm = S.datosMes, fest = dm.festivos;

  });
  const conteo = [0,0,0,0,0]; hab.forEach(h => { if (F.sel.has(h.d)) conteo[h.wd]++; });
  const sinMarcar = hab.filter(h => m.fijos.includes(h.wd) && !fest[h.d] && !F.sel.has(h.d)).length;

  $('#fCuerpo').innerHTML = `
    <div class="tarjeta">
      <h3>Días que ha ido</h3>
      <p class="ayuda">${propuesta
        ? (m.estado==='enhoja' ? 'Marcado a partir de lo que ya había en la hoja. Revisa y guarda.' : 'Propuesta según sus días fijos. Desmarca los días que no fue y marca los extra.')
        : 'Toca un día para marcarlo o desmarcarlo.'}</p>
      <div class="cal">${celdas}</div>
      <div class="conteo">${DIAS_CORTOS.map((x,i)=>`<div><b>${conteo[i]}</b>${x}</div>`).join('')}</div>
      ${sinMarcar && !bloq(dm) ? `<div class="pista">${sinMarcar} día${sinMarcar>1?'s':''} fijo${sinMarcar>1?'s':''} sin marcar
          ${(F.v.ausencias||0) !== sinMarcar ? `<button id="usarAus">Poner en ausencias</button>`:''}</div>` : ''}
      <div class="leyenda"><span><i style="background:var(--azul)"></i>Ha ido</span><span><i style="border:2px solid var(--borde-fijo);background:var(--fondo)"></i>Día fijo</span><span><i style="background:repeating-linear-gradient(135deg,var(--fondo) 0 3px,var(--linea) 3px 6px)"></i>Festivo</span></div>
    </div>

    <div class="tarjeta">
      <h3>Incidencias</h3>
      ${paso('partidos','Partidos de liga','')}
      ${paso('ausencias','Ausencias','Días que no fue')}
      ${paso('sust','Sustituciones','Veces que cubrió a otro')}
      <div class="campo"><div class="et">Km especiales<small>Formación, liga, partidos…</small></div>
        <div class="sufijo"><input class="num" inputmode="decimal" data-f="km" value="${fmt(F.v.km)}" placeholder="0" ${bloq(dm)?'disabled':''}>km</div></div>
      <div class="campo"><div class="et">Peajes</div>
        <div class="sufijo"><input class="num" inputmode="decimal" data-f="peajes" value="${fmt(F.v.peajes)}" placeholder="0,00" ${bloq(dm)?'disabled':''}>€</div></div>
    </div>

    <div class="tarjeta">
      <h3>Observaciones</h3>
      <p class="ayuda">Motivo de la ausencia, a quién sustituye y qué día, etc.</p>
      <div class="chips">${['Sustituye a ','Falta el ','Formación ','Comparte coche'].map(c=>`<button class="chip" data-chip="${c}">${c.trim()}…</button>`).join('')}</div>
      <textarea id="obs" placeholder="Ej.: Sustituye a Víctor en Griseras el 3/11" ${bloq(dm)?'disabled':''}>${esc(F.v.obs)}</textarea>
      ${m.actualizado ? `<div class="meta">Última vez guardado ${new Date(m.actualizado).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${m.por?' por '+esc(m.por):''}</div>`:''}
    </div>`;

  const cuerpo = $('#fCuerpo');
  cuerpo.querySelectorAll('.dia').forEach(b => b.onclick = () => {
    const d = +b.dataset.d; F.sel.has(d) ? F.sel.delete(d) : F.sel.add(d); F.sucio = true;

  cuerpo.querySelectorAll('[data-paso]').forEach(b => b.onclick = () => {

  });

function paso(f, et, sub) {
  const dis = bloq(S.datosMes) ? 'disabled' : '';
  return `<div class="campo"><div class="et">${et}${sub?`<small>${sub}</small>`:''}</div>
    <div class="paso"><button data-paso="${f}" data-delta="-1" ${dis} aria-label="Restar">−</button><output>${S.ficha.v[f]||0}</output><button data-paso="${f}" data-delta="1" ${dis} aria-label="Sumar">+</button></div></div>`;
}
function fmt(v){ return v===null||v===undefined||v==='' ? '' : String(v).replace('.',','); }
function aNum(v){ if (v===null||v===undefined||v==='') return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }

$('#guardar').onclick = () => {
  const F = S.ficha, v = F.v, dm = S.datosMes, m = F.m;
  const dias = [...F.sel].sort((a,b)=>a-b);
  const conteo = [0,0,0,0,0]; dias.forEach(d => { const w = new Date(dm.anio, dm.mesNum-1, d).getDay(); if (w>=1&&w<=5) conteo[w-1]++; });
  const params = { mes:dm.mes, grupo:dm.grupo, key:m.key, dias,
    partidos: v.partidos||null, ausencias: v.ausencias||null, sust: v.sust||null, km: aNum(v.km), peajes: aNum(v.peajes), obs: v.obs||'' };
  // se actualiza al momento en el móvil...
  Object.assign(m, { dias, estado:'enviando', actualizado:new Date().toISOString(), por:S.user.persona });
  Object.assign(m.datos, { conteo, partidos:params.partidos, ausencias:params.ausencias, sust:params.sust, km:params.km, peajes:params.peajes, obs:params.obs });
  // ...y se envía por detrás (si ya había un envío pendiente del mismo monitor, se sustituye)
  S.cola = S.cola.filter(x => !(x.action === 'guardarMonitor' && x.params.mes === params.mes && x.params.grupo === params.grupo && x.params.key === params.key));
  S.cola.push({ action:'guardarMonitor', params, local: JSON.parse(JSON.stringify(m)) });
  guardarCola(); guardarCache();
  F.sucio = false; cerrarFicha(false); pintarLista();
  toast('Guardado ✓');
  enviarCola();
};

let enviando = false;
async function enviarCola() {
  if (enviando || !S.cola.length) return;
  enviando = true;
  try {
    while (S.cola.length) {
      const paquete = S.cola.slice(0, 40);              // todo lo pendiente en UNA llamada
      let res;
      try {
        if (S.sinLote) throw Object.assign(new Error('Acción desconocida'), {legacy:true});
        res = await api('lote', { items: paquete.map(x => ({ action:x.action, params:x.params })) });
      } catch (e) {
        if (e.red) { marcarSinRed(true); break; }
        if (!/Acci[oó]n desconocida/.test(e.message)) { toast(e.message, true); break; }
        S.sinLote = true;                                  // servidor antiguo: de uno en uno
        res = [];
        for (const it of paquete) {
          try { res.push({ ok:true, data: await api(it.action, it.params) }); }
          catch (e2) { if (e2.red) { marcarSinRed(true); break; } res.push({ ok:false, error:e2.message }); }
        }
        if (res.length < paquete.length) { S.cola.splice(0, res.length); guardarCola(); break; }
      }
      S.cola.splice(0, paquete.length); guardarCola();
      paquete.forEach((it, i) => {
        const r = res[i] || {};
        if (r.ok) actualizarEstado(it, 'guardado', r.data && r.data.actualizado);
        else { actualizarEstado(it, 'error'); toast(r.error || 'Error al guardar', true); }
      });
      marcarSinRed(false);
    }
  } finally { enviando = false; guardarCache(); actualizarAvisos(); }
}
function actualizarEstado(it, estado, cuando) {
  if (it.action !== 'guardarMonitor') return;
  const d = S.datos[it.params.mes]; if (!d) return;
  const m = (d.grupos[it.params.grupo] || []).find(x => x.key === it.params.key);
  if (m) { m.estado = estado; if (cuando) m.actualizado = cuando; }
  if (!S.ficha && S.tab === 'monitores' && S.mes === it.params.mes) pintar();
}

function agregar(R, meses) {
  const z = {}, mon = {}, t = {viajes:0,aus:0,sust:0,part:0,km:0,peajes:0,monit:0,conInc:0};
  meses.forEach(m => (R.filas[m]||[]).forEach(([g,n,v,a,su,pa,km,pe]) => {
    const Z = z[g] || (z[g] = {g,viajes:0,aus:0,sust:0,part:0,km:0,peajes:0,mon:new Set()});
    Z.viajes+=v; Z.aus+=a; Z.sust+=su; Z.part+=pa; Z.km+=km; Z.peajes+=pe; Z.mon.add(n);
    const k = g+'|'+n, M = mon[k] || (mon[k] = {g,n,aus:0,sust:0,inc:false});
    M.aus+=a; M.sust+=su; if (a||su) M.inc = true;
    t.viajes+=v; t.aus+=a; t.sust+=su; t.part+=pa; t.km+=km; t.peajes+=pe;
  }));
  const mons = Object.values(mon); t.monit = mons.length; t.conInc = mons.filter(x=>x.inc).length;
  return { t, zonas:Object.values(z), mons };
}

/* ---------- informe en PDF ----------
   En ordenador y Android se usa la impresión del navegador (mejor calidad).
   En iPhone (y cuando falla) el PDF se genera dentro de la app y se abre el menú Compartir. */
const cargarScript = src => new Promise((ok, ko) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(t); });
async function exportarPDF(nomPer) {
  if (!esIOS() && !(window.google && google.script)) { window.print(); return; }
  const btn = $('#btnPdf'); const txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Generando PDF…';
  const temaAntes = document.documentElement.getAttribute('data-tema');
  try {
    await Promise.all([cargarScript('lib/html2canvas.min.js'), cargarScript('lib/jspdf.umd.min.js')]);
    // maquetar en claro y a ancho fijo
    document.documentElement.setAttribute('data-tema', 'claro');
    document.body.classList.add('modo-pdf'); S._anchoPDF = 1060; pintarResumen();
    await new Promise(r => setTimeout(r, 120));
    await Promise.all([...document.querySelectorAll('#main img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const main = $('#main'), base = main.getBoundingClientRect().top + scrollY;
    // posibles puntos de corte: final de cada bloque (no se parte ninguna tarjeta)
    const cortes = [...main.querySelectorAll('.inf-cab,.kpis,.rejilla>.tarjeta')].map(el => { const r = el.getBoundingClientRect(); return r.bottom + scrollY - base; }).sort((a,b)=>a-b);
    const canvas = await html2canvas(main, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: document.documentElement.clientWidth });
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const M = 10, anchoMM = 210 - 2*M, altoMM = 297 - 2*M - 6;
    const pxPorMM = canvas.width / anchoMM, altoPx = altoMM * pxPorMM, escala = canvas.width / main.offsetWidth;
    let ini = 0, pag = 0;
    while (ini < canvas.height - 4) {
      let fin = ini + altoPx;
      const c = cortes.map(x => x * escala).filter(x => x > ini + 40 && x <= fin);
      if (fin < canvas.height && c.length) fin = Math.max(...c) + 8; else fin = Math.min(fin, canvas.height);
      const trozo = document.createElement('canvas'); trozo.width = canvas.width; trozo.height = Math.ceil(fin - ini);
      const g = trozo.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, trozo.width, trozo.height);
      g.drawImage(canvas, 0, ini, canvas.width, trozo.height, 0, 0, canvas.width, trozo.height);
      if (pag++) doc.addPage();
      doc.addImage(trozo.toDataURL('image/jpeg', 0.9), 'JPEG', M, M, anchoMM, trozo.height / pxPorMM);
      ini = fin;
    }
    const total = doc.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
      doc.text(`Fundación Osasuna · Escuela de Fútbol 2026-27 · Informe de incidencias · ${nomPer}`, M, 297 - 6);
      doc.text(`${i} / ${total}`, 210 - M, 297 - 6, { align: 'right' });
    }
    const nombre = `Informe incidencias ${nomPer}.pdf`.replace(/\s+/g, ' ');
    mostrarPdfListo(new File([doc.output('blob')], nombre, { type: 'application/pdf' }));
  } catch (e) {
    toast('No se pudo generar el PDF: ' + e.message, true);
  } finally {
    document.body.classList.remove('modo-pdf'); S._anchoPDF = null;
    document.documentElement.setAttribute('data-tema', temaAntes);
    pintarResumen();
  }
}
function mostrarPdfListo(file) {
  const url = URL.createObjectURL(file);
  const w = document.createElement('div'); w.id = 'pdfListo';
  const puedeCompartir = navigator.canShare && navigator.canShare({ files: [file] });
  w.innerHTML = `<div class="hoja"><div class="ic">PDF</div><h3>Informe listo</h3><p>${esc(file.name)}</p>
    ${puedeCompartir ? '<button class="btn" id="pdfCompartir">Compartir · Guardar · Imprimir</button>' : ''}
    <a class="btn ${puedeCompartir ? 'sec' : ''}" id="pdfAbrir" href="${url}" target="_blank" rel="noopener" download="${esc(file.name)}" style="text-decoration:none">Abrir PDF</a>
    <button class="btn sec" id="pdfCerrar">Cerrar</button></div>`;
  document.body.appendChild(w);
  const cerrar = () => { w.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };
  w.onclick = e => { if (e.target === w) cerrar(); };
  $('#pdfCerrar').onclick = cerrar;
  const sh = $('#pdfCompartir');
  if (sh) sh.onclick = async () => { try { await navigator.share({ files: [file], title: file.name }); cerrar(); } catch (e) { if (e.name !== 'AbortError') toast('Usa «Abrir PDF»', true); } };
}

let _rz; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (S.tab === 'resumen') pintarResumen(); }, 200); });
const nrm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
/** Tarjeta de recordatorios por WhatsApp (solo administración). */
function recordatoriosAdmin() {
  const cs = (S.user.contactos || []);
  if (!cs.length) return '';
  const mes = S.periodo !== 'Temporada' ? S.periodo : (S.user.meses.includes(S.user.mesActual) ? S.user.mesActual : S.user.meses[S.user.meses.length-1]);
  const d = S.datos[mes];
  if (!d) return '';
  const url = location.origin + location.pathname;
  const filas = cs.map(c => {
    let pend = 0, tot = 0;
    c.grupos.forEach(g => { const k = Object.keys(d.grupos).find(x => nrm(x) === nrm(g)); const l = d.grupos[k] || [];
      tot += l.length; pend += l.filter(m => m.estado === 'pendiente' || m.estado === 'error').length; });
    let tel = c.telefono || ''; if (tel && !tel.startsWith('+') && tel.length === 9) tel = '34' + tel; tel = tel.replace('+','');
    const nombre = c.persona.split(' ')[0];
    const msg = `Hola ${nombre} 👋 Te quedan ${pend} monitor${pend>1?'es':''} por revisar de ${mes} en la app de incidencias. Si no tienen incidencias, puedes confirmarlos con ✓ en un momento: ${url}?c=${encodeURIComponent(c.codigo)} ¡Gracias!`;
    return { c, pend, tot, tel, msg };
  });
  const totalPend = filas.reduce((a,f)=>a+f.pend,0);
  const grupo = `📋 Incidencias de ${mes} — monitores pendientes de revisar:\n` + filas.filter(f=>f.pend).map(f=>`• ${f.c.persona}: ${f.pend}`).join('\n') + `\n\nApp: ${url}`;
  return `<details class="tarjeta noprint recs" ${S._recsAbierto ? 'open' : ''}>
    <summary><span>⏰ Recordatorios · ${esc(mes)}</span><span class="${totalPend?'pill-pend':'al-dia'}">${totalPend ? totalPend + ' pendientes' : '✓ Al día'}</span></summary>
    ${totalPend ? `<div style="margin:10px 0 4px"><a class="wa gris" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(grupo)}">Mensaje para el grupo de WhatsApp</a></div>` : ''}
    <p class="ayuda">${totalPend ? `Quedan <b>${totalPend}</b> monitores sin revisar. Envía un recordatorio con un toque (se abre WhatsApp con el mensaje y su enlace de acceso).` : 'Todos los responsables están al día. 👏'}</p>
    <div class="contactos">${filas.map(f => `<div class="contacto">
      <img src="${fotoDe(f.c.persona)}" alt="" onerror="this.outerHTML='<div class=ini>${esc(f.c.persona.split(' ').map(x=>x[0]).join('').slice(0,2))}</div>'">
      <div class="nm"><b>${esc(f.c.persona)}</b><span>${f.pend ? `${f.pend} de ${f.tot} pendientes` : `${f.tot} monitores`}</span></div>
      ${f.pend ? `<a class="wa ${f.tel?'':'gris'}" target="_blank" rel="noopener" href="https://wa.me/${f.tel}?text=${encodeURIComponent(f.msg)}">${f.tel ? 'WhatsApp' : 'Elegir chat'}</a>` : '<span class="al-dia">✓ Al día</span>'}
    </div>`).join('')}</div>
    ${filas.some(f=>f.pend && !f.tel) ? '<p class="meta" style="text-align:left">Para enviar directo a cada uno, añade su móvil en la columna «Teléfono (WhatsApp)» de la hoja _Accesos.</p>' : ''}
  </details>`;
}

function kpi(n, t, s, color) { return `<div class="kpi" style="--k:${color}"><div class="n">${n}</div><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }

/** Columnas agrupadas (2 series) con eje Y limpio y tooltip. */
function columnas(datos) {
  const W = Math.round(S._wAncho || 640), H = innerWidth >= 900 ? 240 : 200, pl = 34, pr = 8, pt = 14, pb = 26;
  const max = Math.max(1, ...datos.flatMap(d => [d.aus, d.sust]));
  const paso = [1,2,5,10,20,25,50,100,200,500].find(p => max / p <= 5) || 1000, top = Math.ceil(max / paso) * paso;
  const y = v => pt + (H - pt - pb) * (1 - v / top), bw = Math.min(22, ((W - pl - pr) / datos.length - 14) / 2);
  const slot = (W - pl - pr) / datos.length;
  let g = '';
  for (let v = 0; v <= top; v += paso) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--linea)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" style="fill:var(--gris)" text-anchor="end">${v}</text>`;
  datos.forEach((d, i) => {
    const cx = pl + slot * i + slot / 2, act = S.periodo === d.m;
    [[d.aus, C_AUS, -1], [d.sust, C_SUS, 1]].forEach(([v, c, lado]) => {
      const x = lado < 0 ? cx - bw - 1 : cx + 1, h = Math.max(0, H - pb - y(v));
      if (h > 0) g += `<path d="${barraV(x, H - pb, bw, h)}" style="fill:${c}" opacity="${S.periodo==='Temporada'||act?1:.35}"/>`;
    });
    g += `<rect x="${cx - slot/2}" y="${pt}" width="${slot}" height="${H-pt-pb}" fill="transparent" data-tip="<b>${d.m}</b><br>Ausencias ${d.aus}<br>Sustituciones ${d.sust}"/>`;
    g += `<text x="${cx}" y="${H-8}" font-size="12" style="fill:${act?'var(--tinta)':'var(--gris)'}" font-weight="${act?700:500}" text-anchor="middle">${MES_CORTO[d.m]}</text>`;
  });
  return `<svg class="svgw" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img" aria-label="Ausencias y sustituciones por mes">${g}</svg>`;
}
function barraV(x, base, w, h) { const r = Math.min(4, h, w/2); return `M${x},${base}V${base-h+r}Q${x},${base-h} ${x+r},${base-h}H${x+w-r}Q${x+w},${base-h} ${x+w},${base-h+r}V${base}Z`; }
function barraH(x, y, w, h) { const r = Math.min(4, w, h/2); return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`; }

/** Barras horizontales (una serie) con valor en la punta. */
function barrasH(items, color, dec, suf) {
  if (!items.length) return '<p class="ayuda">Sin datos.</p>';
  const W = Math.round(S._wMitad || 460), fila = 30, lab = Math.min(170, W * 0.38), pr = 56, H = items.length * fila + 4;
  const max = Math.max(1e-9, ...items.map(i => i.valor));
  let g = '';
  items.forEach((it, i) => {
    const yy = i * fila + 6, w = Math.max(it.valor > 0 ? 3 : 0, (W - lab - pr) * it.valor / max);
    const nombre = it.etiqueta.length > 22 ? it.etiqueta.slice(0, 21) + '…' : it.etiqueta;
    g += `<text x="0" y="${yy+(it.sub?8:13)}" font-size="12" style="fill:var(--tinta)" font-weight="600">${esc(nombre)}</text>`;
    if (it.sub) g += `<text x="0" y="${yy+20}" font-size="10" style="fill:var(--gris)">${esc(it.sub.length>26?it.sub.slice(0,25)+'…':it.sub)}</text>`;
    g += `<rect x="${lab}" y="${yy}" width="${W-lab-pr}" height="18" rx="4" style="fill:var(--pista)"/>`;
    if (w > 0) g += `<path d="${barraH(lab, yy, w, 18)}" style="fill:${color}"/>`;
    g += `<text x="${lab + w + 6}" y="${yy+13}" font-size="12" style="fill:var(--tinta)" font-weight="700">${nf(it.valor, dec)}${suf}</text>`;
    g += `<rect x="0" y="${yy-4}" width="${W}" height="${fila}" fill="transparent" data-tip="${esc(it.tip)}"/>`;
  });
  return `<svg class="svgw" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img">${g}</svg>`;
}

/* tooltip ligero para los gráficos (ratón y dedo) */
(function(){
  const tip = $('#tip');
  const show = (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('si'); return; }
    tip.innerHTML = t.getAttribute('data-tip'); const p = e.touches ? e.touches[0] : e;
    const x = Math.min(innerWidth - tip.offsetWidth - 8, p.clientX + 12), y = Math.max(8, p.clientY - tip.offsetHeight - 12);
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('si'); };
  document.addEventListener('mousemove', show);
  document.addEventListener('touchstart', show, {passive:true});
  document.addEventListener('scroll', () => tip.classList.remove('si'), true);
})();

/* ======================= MENÚ / INSTALAR ======================= */
let eventoInstalar = null;
const esStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function mostrarBannerInstalar() {
  if (esStandalone() || (window.google && google.script)) return;
  const quitado = +store.get('inc_inst_no') || 0;
  if (Date.now() - quitado < 3 * 864e5) return;                 // si dijo "ahora no", volver a sugerir en 3 días
  if (eventoInstalar) {
    $('#instTx').innerHTML = '<b>Instala la app</b>Ábrela desde la pantalla de inicio como una app más.';
    $('#instSi').classList.remove('oculto');
  } else if (esIOS()) {
    const safari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    $('#instTx').innerHTML = safari
      ? '<b>Instala la app en tu iPhone</b>Pulsa <b style="display:inline">Compartir</b> <svg width="14" height="16" viewBox="0 0 14 18" style="vertical-align:-2px"><path d="M7 1v11M3 5l4-4 4 4M1 9v8h12V9" fill="none" stroke="#1d4ed8" stroke-width="1.8"/></svg> abajo y luego <b style="display:inline">«Añadir a pantalla de inicio»</b>.'
      : '<b>Instala la app en tu iPhone</b>Abre este enlace en <b style="display:inline">Safari</b> y pulsa Compartir → «Añadir a pantalla de inicio».';
    $('#instSi').classList.add('oculto');
  } else return;
  $('#instalarBanner').classList.remove('oculto'); document.body.classList.add('conBanner');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; mostrarBannerInstalar(); });
window.addEventListener('appinstalled', () => { $('#instalarBanner').classList.add('oculto'); eventoInstalar = null; });
$('#instSi').onclick = async () => { $('#instalarBanner').classList.add('oculto'); document.body.classList.remove('conBanner'); if (eventoInstalar) { eventoInstalar.prompt(); eventoInstalar = null; } };
$('#instNo').onclick = () => { $('#instalarBanner').classList.add('oculto'); document.body.classList.remove('conBanner'); store.set('inc_inst_no', Date.now()); };
setTimeout(mostrarBannerInstalar, 1200);
$('#btnMenu').onclick = () => {
  $('#menuInfo').innerHTML = `Conectado como <b>${esc(S.user.persona)}</b>${S.user.admin?' (administración)':''}.<br>Grupos: ${S.user.grupos.map(g=>esc(titulo(g))).join(', ')}`;
  $('#instalar').classList.toggle('oculto', esStandalone());
  pintarTemas();
  $('#menu').classList.remove('oculto');
};
function pintarTemas(){ const t = store.get('inc_tema') || 'auto'; document.querySelectorAll('.temas button').forEach(b => b.classList.toggle('on', b.dataset.tema === t)); }
document.querySelectorAll('.temas button').forEach(b => b.onclick = () => {
  store.set('inc_tema', b.dataset.tema); aplicarTema(); pintarTemas();
  if (S.tab === 'resumen') pintarResumen();
});
$('#menu').onclick = e => { if (e.target.id === 'menu') $('#menu').classList.add('oculto'); };
$('#recargar').onclick = () => { $('#menu').classList.add('oculto'); enviarCola(); cargar(true); };
$('#instalar').onclick = async () => {
  $('#menu').classList.add('oculto');
  if (eventoInstalar) { eventoInstalar.prompt(); eventoInstalar = null; return; }
  store.del('inc_inst_no'); mostrarBannerInstalar();
  if ($('#instalarBanner').classList.contains('oculto')) toast('Usa el menú del navegador → «Añadir a pantalla de inicio»');
};
$('#salir').onclick = () => {
  if (S.cola.length && !confirm('Hay ' + S.cola.length + ' cambio(s) sin enviar todavía. ¿Cerrar sesión igualmente?')) return;
  store.del('inc_codigo'); store.del('inc_cache_'+S.codigo); store.del('inc_cola_'+S.codigo); location.reload();
};

/* ======================= ARRANQUE ======================= */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !(window.google && google.script)) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data !== 'nueva-version') return;
    const t = $('#toast'); t.innerHTML = 'Hay una versión nueva · <u>Actualizar</u>'; t.className = 'si'; t.style.pointerEvents = 'auto';
    t.onclick = () => location.reload();
  });
}
(function(){
  const url = new URLSearchParams(location.search).get('c');   // enlace directo: ...?c=CODIGO
  const guardado = url || store.get('inc_codigo');
  if (guardado) { $('#codigo').value = guardado; entrar(guardado, !url); }
})();
</script>
